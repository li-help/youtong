# ============================================================
# 优童成长社 GitHub Actions CI/CD 流水线
# 触发：push 到 main 分支 或 手动运行（Actions 页面 Run workflow）
# 流程：构建后端 jar → 构建后台 dist → 构建安卓 APK → 部署到生产服务器
# 依赖 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SERVER_HOST        服务器 IP（如 123.56.160.50）
#   SERVER_USER        SSH 登录用户（如 root）
#   SSH_PRIVATE_KEY    服务器 SSH 私钥内容（含 ----BEGIN/END----）
#   APP_UPLOAD_DIR     上传目录（如 /opt/youtong/uploads）
#   MYSQL_PASSWORD     数据库应用账号 youtong 的密码（与 server-init.sh 设置的保持一致）
# ============================================================

name: 优童成长社 CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- 1. 构建后端 ----------
  build-backend:
    name: 构建后端 jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: Maven 打包
        run: cd backend && mvn clean package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/youtong-admin-backend-1.0.0.jar
          retention-days: 7

  # ---------- 2. 构建后台前端 ----------
  build-admin:
    name: 构建后台前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 安装依赖
        run: cd admin && npm install --registry=https://registry.npmmirror.com

      - name: 构建（注入真实下载地址）
        env:
          VITE_APP_DOWNLOAD_URL: http://${{ secrets.SERVER_HOST }}/download/app-release.apk
        run: cd admin && npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/
          retention-days: 7

  # ---------- 3. 构建安卓 App（APK） ----------
  build-app:
    name: 构建安卓 App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 缓存 Gradle 依赖，避免每次构建重新下载（网络波动导致 assembleRelease 失败）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 清理构建残留（避免 watcher 状态冲突）
        run: |
          cd app
          rm -rf .dart_tool build android/.gradle

      - name: 安装依赖
        env:
          # 禁用 Gradle 文件系统监听与 daemon，避免 CI 上 "Already watching path" 卡死
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
        run: cd app && flutter pub get

      - name: 构建 release APK（API 指向生产服务器，失败自动重试一次）
        env:
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
          GRADLE_USER_HOME: ~/.gradle
        run: |
          cd app
          flutter build apk --release --dart-define=API_BASE_URL=http://${{ secrets.SERVER_HOST }}/api \
            || flutter build apk --release --dart-define=API_BASE_URL=http://${{ secrets.SERVER_HOST }}/api

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ---------- 3.5 构建 Web 端（浏览器直接访问） ----------
  build-app-web:
    name: 构建 Web 端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: cd app && flutter pub get

      # Web 端部署在 /web/ 子路径：用 --base-href=/web/ 指定资源基准路径
      # API 走相对路径 /api（由 Nginx 反代到后端 3001），无需硬编码域名
      - name: 构建 release Web（部署路径 /web/，失败自动重试一次）
        run: |
          cd app
          flutter build web --release --base-href=/web/ --dart-define=API_BASE_URL=/api \
            || flutter build web --release --base-href=/web/ --dart-define=API_BASE_URL=/api

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-web
          path: app/build/web/
          retention-days: 7

  # ---------- 4. 部署到生产服务器 ----------
  deploy:
    name: 部署到生产服务器
    needs: [build-backend, build-admin, build-app, build-app-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend-jar

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: ./admin-dist

      - uses: actions/download-artifact@v4
        with:
          name: app-apk
          path: ./app-apk

      - uses: actions/download-artifact@v4
        with:
          name: app-web
          path: ./app-web

      - name: 部署
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_UPLOAD_DIR: ${{ secrets.APP_UPLOAD_DIR }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set -e
          # 准备 SSH 私钥（ubuntu-latest 已预装 rsync，无需 apt 安装，避免 apt 拉源卡死）
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_rsa
          # 私钥为空/无效时直接报错，避免 ssh 卡在密码交互
          [ -s ~/.ssh/id_rsa ] || { echo "!! SSH_PRIVATE_KEY 为空或无效，请检查 GitHub Secret 配置"; rm -f ~/.ssh/id_rsa; exit 1; }

          # 统一 SSH 参数：免交互 + 自动接受主机密钥 + 连接超时快速失败
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          SSH_TARGET="$SERVER_USER@$SERVER_HOST"

          APP_DIR=/opt/youtong

          # 1) 创建服务器目标目录（含备份目录）
          ssh $SSH_OPTS $SSH_TARGET "mkdir -p $APP_DIR/app $APP_DIR/admin $APP_DIR/backup $APP_UPLOAD_DIR"

          # 2) 备份当前运行的 jar（保留最近 10 份，便于回滚）
          ssh $SSH_OPTS $SSH_TARGET \
            "cd $APP_DIR/app && [ -f app.jar ] && cp app.jar $APP_DIR/backup/app-\$(date +%Y%m%d-%H%M%S).jar && ls -1t $APP_DIR/backup/*.jar 2>/dev/null | tail -n +11 | xargs -r rm -f || true"

          # 3) 上传后端 jar（替换旧包）
          rsync -avz -e "ssh $SSH_OPTS" ./backend-jar/youtong-admin-backend-1.0.0.jar $SSH_TARGET:$APP_DIR/app/app.jar

          # 4) 上传数据库脚本与初始化工具
          rsync -avz -e "ssh $SSH_OPTS" backend/schema.sql backend/seed.sql $SSH_TARGET:$APP_DIR/app/
          rsync -avz -e "ssh $SSH_OPTS" deploy/init-db.sh $SSH_TARGET:$APP_DIR/init-db.sh

          # 5) 上传后台 dist
          rsync -avz -e "ssh $SSH_OPTS" --delete ./admin-dist/ $SSH_TARGET:$APP_DIR/admin/

          # 5.5) 上传 App APK（下载直链 /download/app-release.apk）
          ssh $SSH_OPTS $SSH_TARGET "mkdir -p $APP_DIR/app/downloads && chmod 755 $APP_DIR/app/downloads"
          rsync -avz -e "ssh $SSH_OPTS" ./app-apk/app-release.apk $SSH_TARGET:$APP_DIR/app/downloads/app-release.apk

          # 5.6) 上传 App 下载页（含二维码组件）
          rsync -avz -e "ssh $SSH_OPTS" deploy/download.html deploy/qrcode.min.js $SSH_TARGET:$APP_DIR/app/downloads/

          # 5.8) 上传 Flutter Web 端（浏览器直接访问，部署在 /web/ 子路径）
          ssh $SSH_OPTS $SSH_TARGET "mkdir -p $APP_DIR/web && chmod 755 $APP_DIR/web"
          # 用 --chmod 统一权限，避免 Nginx(www-data) 因属主/权限问题无法读取静态资源
          rsync -avz -e "ssh $SSH_OPTS" --delete --chmod=D755,F644 ./app-web/ $SSH_TARGET:$APP_DIR/web/

          # 5.9) 上传官方网站（项目介绍落地页，部署在 /site/ 子路径）
          ssh $SSH_OPTS $SSH_TARGET "mkdir -p $APP_DIR/site && chmod 755 $APP_DIR/site"
          rsync -avz -e "ssh $SSH_OPTS" --delete --chmod=D755,F644 ./website/ $SSH_TARGET:$APP_DIR/site/

          # 5.7) 应用 Nginx 配置（以仓库 deploy/youtong.conf 为准，始终同步并校验重载）
          rsync -avz -e "ssh $SSH_OPTS" deploy/youtong.conf $SSH_TARGET:/opt/youtong/youtong.conf.new
          ssh $SSH_OPTS $SSH_TARGET \
            "cp /etc/nginx/conf.d/youtong.conf /etc/nginx/conf.d/youtong.conf.bak && cp /opt/youtong/youtong.conf.new /etc/nginx/conf.d/youtong.conf && nginx -t && systemctl reload nginx && echo 'nginx-config-reloaded'"

          # 6) 幂等初始化数据库（已存在表则跳过，不会覆盖线上数据）
          if [ -n "$MYSQL_PASSWORD" ]; then
            ssh $SSH_OPTS $SSH_TARGET \
              "MYSQL_PASSWORD='$MYSQL_PASSWORD' bash $APP_DIR/init-db.sh $APP_DIR/app/schema.sql $APP_DIR/app/seed.sql"
          else
            echo "警告: 未配置 MYSQL_PASSWORD，跳过数据库初始化（请确认库表已就绪）"
          fi

          # 7) 重启后端服务
          ssh $SSH_OPTS $SSH_TARGET "systemctl restart youtong 2>/dev/null || echo 'service-not-found'"

          # 8) 健康检查（白名单放行 /api/sync/*，无需登录；60s 内就绪视为成功）
          set +e
          HEALTHY=""
          for i in $(seq 1 30); do
            HTTP_CODE=$(ssh $SSH_OPTS $SSH_TARGET "curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3001/api/sync/version?channel=health'" 2>/dev/null)
            if [ "$HTTP_CODE" = "200" ]; then HEALTHY="ok"; break; fi
            sleep 2
          done
          set -e
          if [ -z "$HEALTHY" ]; then
            echo "!! 健康检查失败：后端未在 60s 内就绪，请查看服务器日志: journalctl -u youtong -n 100"
            echo "!! 若为首次部署，请确认已执行 deploy/server-init.sh 并配置好 MySQL 账号"
            rm -f ~/.ssh/id_rsa
            exit 1
          fi
          echo "健康检查通过：后端已就绪"

          # 8.5) 数据库表结构校验
          #     注意: /api/sync/version 是纯内存实现(不查库)，上面的健康检查通过不代表数据库可用！
          #     用服务器上的 MySQL 客户端直接验证表数量与核心表完整性，
          #     防止"健康检查通过但管理后台接口全部 500"被掩盖。
          if [ -n "$MYSQL_PASSWORD" ]; then
            set +e
            DB_TABLES=$(ssh $SSH_OPTS $SSH_TARGET \
              "MYSQL_PWD='$MYSQL_PASSWORD' mysql -uyoutong -h127.0.0.1 -N -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='youtong'\"" 2>/dev/null)
            DB_TABLES=${DB_TABLES:-CONNECT_ERROR}
            set -e
            echo "线上 youtong 库当前表数量: $DB_TABLES"
            if [ "$DB_TABLES" = "0" ] || [ "$DB_TABLES" = "CONNECT_ERROR" ]; then
              echo "!! 警告: 数据库连接失败或表数量为 0，管理后台接口将全部报错！"
              echo "!! 请检查: 1) GitHub Secret MYSQL_PASSWORD 是否与服务器 youtong 账号一致"
              echo "!!          2) MySQL 服务是否正常 (systemctl status mysql)"
              rm -f ~/.ssh/id_rsa
              exit 1
            fi
            # 校验 14 张核心业务表是否齐全（缺表会导致对应模块接口 500）
            set +e
            MISSING=$(ssh $SSH_OPTS $SSH_TARGET \
              "MYSQL_PWD='$MYSQL_PASSWORD' mysql -uyoutong -h127.0.0.1 -N -e \"SELECT GROUP_CONCAT(t.table_name) FROM (SELECT 'sys_account' AS table_name UNION SELECT 'user' UNION SELECT 'order' UNION SELECT 'store' UNION SELECT 'category' UNION SELECT 'ad' UNION SELECT 'video' UNION SELECT 'course' UNION SELECT 'activity' UNION SELECT 'article' UNION SELECT 'customer_service' UNION SELECT 'faq_knowledge' UNION SELECT 'im_session' UNION SELECT 'im_message') t LEFT JOIN information_schema.tables x ON x.table_schema='youtong' AND x.table_name=t.table_name WHERE x.table_name IS NULL\"" 2>/dev/null)
            set -e
            # GROUP_CONCAT 无匹配时 MySQL 输出 NULL 字符串，需排除
            if [ -n "$MISSING" ] && [ "$MISSING" != "NULL" ]; then
              echo "!! 警告: 数据库缺少以下核心表，对应模块接口将报 500: $MISSING"
              echo "!! 请确认 init-db.sh 已成功执行（表创建失败通常因 MySQL 账号无建表权限或密码错误）"
            else
              echo "数据库表结构校验通过：14 张核心表齐全"
            fi
          else
            echo "警告: 未配置 MYSQL_PASSWORD，跳过数据库表结构校验"
          fi

          rm -f ~/.ssh/id_rsa
