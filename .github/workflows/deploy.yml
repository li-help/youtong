# ============================================================
# 优童成长社 GitHub Actions CI/CD 流水线
# 触发：push 到 main 分支 或 手动运行（Actions 页面 Run workflow）
# 流程：构建后端 jar → 构建后台 dist → 构建安卓 APK → 部署到生产服务器
# 依赖 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SERVER_HOST        服务器 IP（如 123.56.160.50）
#   SERVER_USER        SSH 登录用户（如 root）
#   SSH_PRIVATE_KEY    服务器 SSH 私钥内容（含 ----BEGIN/END----）
#   APP_UPLOAD_DIR     上传目录（如 /opt/youtong/uploads）
#   MYSQL_PASSWORD     数据库应用账号 youtong 的密码（与 server-init.sh 设置的保持一致）
# ============================================================

name: 优童成长社 CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- 1. 构建后端 ----------
  build-backend:
    name: 构建后端 jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: Maven 打包
        run: cd backend && mvn clean package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/youtong-admin-backend-1.0.0.jar
          retention-days: 7

  # ---------- 2. 构建后台前端 ----------
  build-admin:
    name: 构建后台前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 安装依赖
        run: cd admin && npm install --registry=https://registry.npmmirror.com

      - name: 构建（注入真实下载地址）
        env:
          VITE_APP_DOWNLOAD_URL: http://${{ secrets.SERVER_HOST }}/download/app-release.apk
        run: cd admin && npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/
          retention-days: 7

  # ---------- 3. 构建安卓 App（APK） ----------
  build-app:
    name: 构建安卓 App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: cd app && flutter pub get

      - name: 构建 release APK（API 指向生产服务器）
        run: cd app && flutter build apk --release --dart-define=API_BASE_URL=http://${{ secrets.SERVER_HOST }}/api

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ---------- 4. 部署到生产服务器 ----------
  deploy:
    name: 部署到生产服务器
    needs: [build-backend, build-admin, build-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend-jar

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: ./admin-dist

      - uses: actions/download-artifact@v4
        with:
          name: app-apk
          path: ./app-apk

      - name: 部署
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_UPLOAD_DIR: ${{ secrets.APP_UPLOAD_DIR }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set -e
          # 准备 SSH 私钥（ubuntu-latest 已预装 rsync，无需 apt 安装，避免 apt 拉源卡死）
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_rsa
          # 私钥为空/无效时直接报错，避免 ssh 卡在密码交互
          [ -s ~/.ssh/id_rsa ] || { echo "!! SSH_PRIVATE_KEY 为空或无效，请检查 GitHub Secret 配置"; rm -f ~/.ssh/id_rsa; exit 1; }

          # 统一 SSH 参数：免交互 + 自动接受主机密钥 + 连接超时快速失败
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          SSH_TARGET="$SERVER_USER@$SERVER_HOST"

          APP_DIR=/opt/youtong

          # 1) 创建服务器目标目录（含备份目录）
          ssh $SSH_OPTS $SSH_TARGET "mkdir -p $APP_DIR/app $APP_DIR/admin $APP_DIR/backup $APP_UPLOAD_DIR"

          # 2) 备份当前运行的 jar（保留最近 10 份，便于回滚）
          ssh $SSH_OPTS $SSH_TARGET \
            "cd $APP_DIR/app && [ -f app.jar ] && cp app.jar $APP_DIR/backup/app-\$(date +%Y%m%d-%H%M%S).jar && ls -1t $APP_DIR/backup/*.jar 2>/dev/null | tail -n +11 | xargs -r rm -f || true"

          # 3) 上传后端 jar（替换旧包）
          rsync -avz -e "ssh $SSH_OPTS" ./backend-jar/youtong-admin-backend-1.0.0.jar $SSH_TARGET:$APP_DIR/app/app.jar

          # 4) 上传数据库脚本与初始化工具
          rsync -avz -e "ssh $SSH_OPTS" backend/schema.sql backend/seed.sql $SSH_TARGET:$APP_DIR/app/
          rsync -avz -e "ssh $SSH_OPTS" deploy/init-db.sh $SSH_TARGET:$APP_DIR/init-db.sh

          # 5) 上传后台 dist
          rsync -avz -e "ssh $SSH_OPTS" --delete ./admin-dist/ $SSH_TARGET:$APP_DIR/admin/

          # 5.5) 上传 App APK（下载直链 /download/app-release.apk）
          ssh $SSH_OPTS $SSH_TARGET "mkdir -p $APP_DIR/app/downloads && chmod 755 $APP_DIR/app/downloads"
          rsync -avz -e "ssh $SSH_OPTS" ./app-apk/app-release.apk $SSH_TARGET:$APP_DIR/app/downloads/app-release.apk

          # 5.6) 上传 App 下载页（含二维码组件）
          rsync -avz -e "ssh $SSH_OPTS" deploy/download.html deploy/qrcode.min.js $SSH_TARGET:$APP_DIR/app/downloads/

          # 5.7) 应用 Nginx 下载路由（幂等：已配置过则跳过，避免覆盖服务器后续改动）
          rsync -avz -e "ssh $SSH_OPTS" deploy/youtong.conf $SSH_TARGET:/tmp/youtong.conf
          ssh $SSH_OPTS $SSH_TARGET \
            "if ! grep -q 'location = /download.html' /etc/nginx/conf.d/youtong.conf; then cp /etc/nginx/conf.d/youtong.conf /etc/nginx/conf.d/youtong.conf.bak && cp /tmp/youtong.conf /etc/nginx/conf.d/youtong.conf && nginx -t && systemctl reload nginx; else echo 'nginx-download-already-configured'; fi"

          # 6) 幂等初始化数据库（已存在表则跳过，不会覆盖线上数据）
          if [ -n "$MYSQL_PASSWORD" ]; then
            ssh $SSH_OPTS $SSH_TARGET \
              "MYSQL_PASSWORD='$MYSQL_PASSWORD' bash $APP_DIR/init-db.sh $APP_DIR/app/schema.sql $APP_DIR/app/seed.sql"
          else
            echo "警告: 未配置 MYSQL_PASSWORD，跳过数据库初始化（请确认库表已就绪）"
          fi

          # 7) 重启后端服务
          ssh $SSH_OPTS $SSH_TARGET "systemctl restart youtong 2>/dev/null || echo 'service-not-found'"

          # 8) 健康检查（白名单放行 /api/sync/*，无需登录；60s 内就绪视为成功）
          set +e
          HEALTHY=""
          for i in $(seq 1 30); do
            HTTP_CODE=$(ssh $SSH_OPTS $SSH_TARGET "curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3001/api/sync/version?channel=health'" 2>/dev/null)
            if [ "$HTTP_CODE" = "200" ]; then HEALTHY="ok"; break; fi
            sleep 2
          done
          set -e
          if [ -z "$HEALTHY" ]; then
            echo "!! 健康检查失败：后端未在 60s 内就绪，请查看服务器日志: journalctl -u youtong -n 100"
            echo "!! 若为首次部署，请确认已执行 deploy/server-init.sh 并配置好 MySQL 账号"
            rm -f ~/.ssh/id_rsa
            exit 1
          fi
          echo "健康检查通过：后端已就绪"

          rm -f ~/.ssh/id_rsa
