org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 禁用 Gradle 文件系统监听，解决 CI 上 "Already watching path" 卡死问题
org.gradle.vfs.watch=false
# 禁用 daemon 以规避 CI 环境 watcher 冲突
org.gradle.daemon=false
# 依赖下载失败自动重试（Gradle 默认 3 次/250ms 退避太激进）：
# CI 上冷缓存要全量下载 AGP/Kotlin/AndroidX，网络抖动易报 "error while downloading artifacts"。
# 仅重试 408/429/5xx 等可恢复错误，404/401 不会重试。
org.gradle.internal.repository.max.tentatives=8
org.gradle.internal.repository.initial.tentatives.backoff=1000
