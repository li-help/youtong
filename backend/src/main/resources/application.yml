server:
  port: 3001
  error:
    include-stacktrace: always
    include-message: always

spring:
  servlet:
    multipart:
      # 视频文件较大，适当放大上限（图片仍建议控制在合理范围）
      max-file-size: 200MB
      max-request-size: 400MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/youtong?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&socketTimeout=30000&connectTimeout=30000
    # 与部署脚本 server-init.sh / youtong.service 保持一致；
    # 本地开发可改用 application-local.yml 覆盖（已 gitignore）
    username: ${SPRING_DATASOURCE_USERNAME:youtong}
    password: ${SPRING_DATASOURCE_PASSWORD:Youtong2026Db}
    hikari:
      # 连接保活：必须小于 MySQL wait_timeout（默认 8 小时，这里保守设 30 分钟）
      keepalive-time: 300000
      max-lifetime: 1800000
      # 借出连接时校验可用性，避免使用已失效连接
      connection-test-query: SELECT 1
      validation-timeout: 3000
      minimum-idle: 5
      maximum-pool-size: 20

cors:
  allowed-origins: "*"

# 文件上传目录（绝对路径，确保 jar 部署与 IDE 运行下访问一致）
# 上传的图片通过 /uploads/** 静态资源映射对外提供访问（见 WebMvcConfig）
app:
  upload-dir: ${APP_UPLOAD_DIR:D:/youtong/uploads}

wechat:
  miniapp:
    appid: ${WECHAT_APPID:wx4b9c2156878deb40}
    # secret 优先取环境变量 WECHAT_SECRET；本地联调请放 application-local.yml（已 gitignore）
    secret: ${WECHAT_SECRET:}
    # 扫码登录小程序码指向的确认页（须为小程序已发布页面）
    scan-page: ${WECHAT_SCAN_PAGE:pages/scan/confirm}

# 大模型（OpenAI 兼容协议，DeepSeek）
# 注意：api-key 为敏感凭证，请勿提交到公开仓库。
# 生产环境务必通过 DEEPSEEK_API_KEY 环境变量注入
ai:
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-v4-flash
  # 单次请求最长等待时间（毫秒），大模型响应较慢，建议留足
  timeout-ms: 60000
  # 系统提示词：定义 AI 育儿助手的角色
  system-prompt: "你是优童成长社的 AI 育儿助手，面向 0-6 岁宝宝的家长。请用简洁、温暖、专业的中文给出育儿、课程与活动建议，回答控制在 200 字以内。"


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 阿里云短信服务
# 注意：密钥为敏感凭证，请勿提交真实值到公开仓库。
# 生产环境务必通过以下环境变量注入（见服务器 systemd 的 Environment）：
#   ALIYUN_SMS_ACCESS_KEY_ID
#   ALIYUN_SMS_ACCESS_KEY_SECRET
#   ALIYUN_SMS_SIGN_NAME
#   ALIYUN_SMS_TEMPLATE_CODE
# 未配置时自动降级为「演示模式」（sendCode 直接返回明文验证码），方便开发联调。
aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    endpoint: ${ALIYUN_SMS_ENDPOINT:cn-hangzhou}
