server {
    listen 80;
    server_name 123.56.160.50;

    # 后台前端
    root /opt/youtong/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传资源
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # SSE 实时同步（必须关缓冲）
    location /api/stream/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # App 下载直链（APK 静态文件）
    location /download/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # App 下载页
    location = /download.html {
        alias /opt/youtong/app/downloads/download.html;
        default_type text/html;
    }
}
