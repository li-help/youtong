server {
    listen 80;
    server_name 123.56.160.50;

    # 上传大小限制（与后端 multipart 对齐，视频最大 200MB/请求 400MB）
    client_max_body_size 400m;

    # 后台前端
    root /opt/youtong/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # H5 前端（uni-app 构建产物，hash 路由）
    # 注意：必须用 root（/opt/youtong + /h5/ 自然映射到 /opt/youtong/h5/），
    # 不能用 alias + try_files 组合（try_files 在 alias 下会错误检查继承 root 路径，
    # 导致所有静态资源 fallback 返回 index.html，MIME 变为 text/html）
    location = /h5 {
        return 301 /h5/;
    }
    # H5 图片上传资源：/h5/uploads/** 转发到后端 /uploads/**（最长前缀优先，避免被 /h5/ 的 try_files 拦截）
    location /h5/uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_set_header Host $host;
    }
    location /h5/ {
        root /opt/youtong;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # Flutter Web 端（浏览器直接访问，部署在 /web/ 子路径）
    # 必须用 root（/opt/youtong + /web/ 自然映射到 /opt/youtong/web/），与 /h5/ 同理
    location /web/ {
        root /opt/youtong;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }

    # 官方网站（项目介绍落地页，部署在 /site/ 子路径，避免与 /web/ 冲突）
    location /site/ {
        root /opt/youtong;
        index index.html;
        try_files $uri $uri/ /site/index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket IM 即时通信（统一走 Nginx 80 端口，避免暴露后端 3001）
    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 上传资源
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # SSE 实时同步（必须关缓冲）
    location /api/stream/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # App 下载直链（APK 静态文件）
    location /download/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # App 下载页
    location = /download.html {
        alias /opt/youtong/app/downloads/download.html;
        default_type text/html;
    }
}
